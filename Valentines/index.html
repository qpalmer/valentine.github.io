<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Wife ❤️</title>

<style>
body{
  margin:0;
  font-family:Georgia, serif;
  background:#0b0b12;
  color:white;
  text-align:center;
  overflow:hidden;
  padding:40px 20px;
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:20px;
  animation:float 6s linear infinite;
  opacity:.7;
}
@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(-110vh)}
}

.circle{
  width:190px;
  height:190px;
  border-radius:50%;
  background:url("./photo.jpg") center/cover;
  margin:auto;
  border:4px solid #ffb6d9;
  box-shadow:0 0 30px rgba(255,182,217,.6);
}

h1{
  margin-top:25px;
  font-weight:normal;
}

button{
  margin-top:30px;
  padding:15px 28px;
  font-size:18px;
  border:none;
  border-radius:14px;
  background:#ffb6d9;
  color:black;
}

#msg{
  margin-top:30px;
  font-size:22px;
  min-height:60px;
}

.final{
  margin-top:40px;
  font-size:24px;
  color:#ffdede;
}
</style>
</head>

<body>

<div class="circle"></div>

<h1 id="type"></h1>

<button onclick="next()">Tap me ❤️</button>

<div id="msg"></div>
<div class="final" id="final"></div>

<script>
// floating hearts generator
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*20+10)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);

// typewriter intro
const intro = "To my beautiful wife — Proverbs 31:10";
let t=0;

function typeWriter(){
  if(t < intro.length){
    document.getElementById("type").innerHTML += intro.charAt(t);
    t++;
    setTimeout(typeWriter,60);
  }
}
typeWriter();

const messages = [
  "You are a blessing in my life",
  "God knew exactly what He was doing when He gave me you",
  "You bring peace into my world",
  "You’re still my favorite person",
  "Marriage with you is my greatest answered prayer",
  "Happy Valentine’s Day ❤️"
];

let i=0;

function next(){
  if(i < messages.length){
    document.getElementById("msg").innerText = messages[i];
    i++;
  } else {
    document.getElementById("final").innerText =
      "I love you deeply. Thank you for building this life with me. — Your husband";
  }
}
</script>

</body>
</html>
